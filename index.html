<html lang="en">
<head>

<title>wear what? – outfit picker</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#faf7f0"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="wear what?"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#faf7f0;--card:#fffdf9;--ink:#2f2419;--mute:#7d7061;--line:#e8e0d0;--accent:#7a5230;--on:#fffdf9;--soft:#efe6d4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1914;--card:#2a231c;--ink:#f5efe4;--mute:#a89c8a;--line:#3d342a;--accent:#d9b98a;--on:#1e1914;--soft:#3a3125;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1e1914;--card:#2a231c;--ink:#f5efe4;--mute:#a89c8a;--line:#3d342a;--accent:#d9b98a;--on:#1e1914;--soft:#3a3125;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Arial,Helvetica,sans-serif}
main{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:20px 16px 110px}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;color:var(--accent);opacity:.16}
.bg svg{display:block;width:100%;height:100%}
h1{font:700 22px Consolas,"Courier New",monospace;margin:0 0 2px}
h2{font-size:15px;margin:22px 0 8px}
p{margin:0}.mute{color:var(--mute);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on)}
.btn{background:var(--accent);color:var(--on);border:0;border-radius:12px;padding:14px;font:700 16px Arial,sans-serif;width:100%;cursor:pointer;margin-top:18px}
.btn.alt{background:var(--soft);color:var(--accent);margin-top:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 14px}
.slot{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.slot:last-child{border:0}
.slot b{display:block;font-size:15px}
.th{width:52px;height:52px;border-radius:10px;flex:none;object-fit:cover;border:1px solid var(--line);display:grid;place-items:center;font:700 14px Consolas,monospace;color:#0006}
.lock{margin-left:auto;background:none;border:1px solid var(--line);color:var(--mute);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
.lock.on{border-color:var(--accent);color:var(--accent)}
.note{margin:14px 2px 0;color:var(--mute);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.it{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.it .th{width:100%;height:auto;aspect-ratio:1;border-radius:8px}
.it span{display:block;font-size:13px;padding:6px 2px 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day{padding:12px 0;border-bottom:1px solid var(--line)}
.day:last-child{border:0}
.dh{display:flex;align-items:center;gap:8px}
.dh b{width:64px;font:700 14px Consolas,monospace}
select{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px;flex:1;min-width:0}
.mini{display:flex;gap:6px;margin-top:8px;align-items:center}
.mini .th{width:36px;height:36px;border-radius:8px;font-size:10px}
.mini small{color:var(--mute);margin-left:4px;font-size:12px;flex:1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px;text-align:center}.cal i{font-style:normal;font-size:12px;color:var(--mute)}
.cd{position:relative;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px 0;font:inherit;font-size:13px;cursor:pointer}.cd.on{background:var(--accent);color:var(--on);border-color:var(--accent)}
.cd u{position:absolute;left:50%;bottom:3px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--accent)}.cd.on u{background:var(--on)}
.tabs{z-index:5;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;background:none;border:0;color:var(--mute);font:700 14px Arial,sans-serif;padding:12px 0;cursor:pointer;border-radius:10px}
.tabs button.on{color:var(--accent);background:var(--soft)}
.shade{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet label{display:block;font-size:14px;font-weight:700;margin:16px 0 8px}
input[type=text]{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw.on{outline:2px solid var(--accent);outline-offset:2px}
.pic{display:flex;gap:12px;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:30}
.empty{text-align:center;padding:36px 10px}
</style>
</head>
<body>
<div class="bg" id="bg" aria-hidden="true"></div>
<main id="app"></main>
<div id="sheet"></div>

<script>
var CATS=[['tshirt','T-shirts'],['shirt','Shirts'],['sweater','Sweaters & hoodies'],['dress','Dresses'],['pants','Pants'],['skirt','Skirts'],['shorts','Shorts'],['shoes','Shoes'],['socks','Socks'],['jacket','Jackets'],['blazer','Blazers'],['bag','Bags'],['jewelry','Jewellery'],['tie','Ties & belts'],['hat','Hats & caps'],['other','Other']];
var OCC=['casual','work','formal','party','sport'];
var WX=[['hot','Hot'],['mild','Mild'],['cool','Cool'],['cold','Cold'],['rain','Rainy']];
var WARM={hot:0,mild:.8,cool:1.3,cold:2,rain:1.4};
var COL={black:'#262626',white:'#f4f4f1',grey:'#9b9b9b',beige:'#d8c7a8',navy:'#1f2d4d',blue:'#4a76b8',green:'#4f7a5a',red:'#b5483f',brown:'#7a5638',yellow:'#e0b93c',pink:'#e3a1b0'};
var NEU=['black','white','grey','beige','navy','brown'];
var SLOTS=[['dress','Dress'],['top','Top'],['bottom','Bottom'],['shoes','Shoes'],['socks','Socks'],['jacket','Jacket'],['bag','Bag'],['hat','Hat'],['other','Extra']];
var S={items:[],worn:{}},T={tab:'today',occ:'casual',wx:'mild',out:null,locks:{},filt:'all'},draft=null;
var WEEK=[];for(var d=0;d<7;d++)WEEK.push({occ:d>4?'casual':'work',wx:'mild',out:null});
try{var raw=localStorage.getItem('wearwhat');if(raw)S=JSON.parse(raw)}catch(e){}
var idb;
function idbOpen(cb){try{var r=indexedDB.open('wearwhat',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv')};r.onsuccess=function(){idb=r.result;cb()};r.onerror=function(){cb()}}catch(e){cb()}}
function norm(){S.items=S.items||[];S.worn=S.worn||{};S.count=S.count||{};S.favs=S.favs||[];S.log=S.log||[]}
function save(){try{if(idb)idb.transaction('kv','readwrite').objectStore('kv').put(JSON.stringify(S),'s')}catch(e){}try{localStorage.setItem('wearwhat',JSON.stringify(S))}catch(e){if(!idb)toast('Storage is full. Try smaller photos or delete a few items.')}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function $(i){return document.getElementById(i)}
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2400)}
function th(i,cls){return i.img?'<img class="th '+(cls||'')+'" src="'+i.img+'" alt="">':'<div class="th" style="background:'+COL[i.color]+'">'+esc(i.name.slice(0,2))+'</div>'}
function chips(list,cur,act){return '<div class="row">'+list.map(function(x){var v=x[0]||x,l=x[1]||x;return '<button class="chip '+(v===cur?'on':'')+'" data-a="'+act+'" data-v="'+v+'">'+l+'</button>'}).join('')+'</div>'}
function sc(i,occ,wx){var s=(i.styles.indexOf(occ)>-1?3:0)-Math.abs(i.warm-WARM[wx])*1.2+sb(i);var w=S.worn[i.id];if(w){var days=(Date.now()-w)/864e5;if(days<3)s-=2}return s}
function fit(a,b){if(NEU.indexOf(a.color)>-1||NEU.indexOf(b.color)>-1)return 1.5;return a.color===b.color?-1:-.5}
function gen(occ,wx,locks,used){
  locks=locks||{};used=used||{};var o={};
  function pick(slot,cats,extra){
    var lk=locks[slot];if(lk){var f=S.items.filter(function(i){return i.id===lk})[0];if(f){o[slot]=f;return}}
    var pool=S.items.filter(function(i){return cats.indexOf(i.cat)>-1&&ok(i.cat)&&!i.dirty});if(!pool.length)return;
    var best,bs=-1e9;pool.forEach(function(i){var s=sc(i,occ,wx)+Math.random()*1.6-(used[i.id]||0)*2;if(extra)s+=extra(i);if(s>bs){bs=s;best=i}});o[slot]=best}
  var dr=S.gender!=='male'&&occ!=='sport'&&S.items.some(function(i){return i.cat==='dress'});
  if(locks.dress||(dr&&!locks.top&&!locks.bottom&&Math.random()<.45))pick('dress',['dress']);
  if(o.dress&&!locks.dress&&o.dress.styles.indexOf(occ)<0)delete o.dress;
  if(!o.dress)pick('top',['tshirt','shirt','sweater'],function(i){return(occ==='formal'||occ==='work')&&i.cat==='shirt'?1.5:0});
  if(!o.dress)pick('bottom',['pants','skirt','shorts'],function(i){return o.top?fit(o.top,i):0});
  pick('shoes',['shoes'],function(i){return o.bottom?fit(o.bottom,i)*.5:0});
  pick('socks',['socks']);
  if(needJ(wx))pick('jacket',['jacket','blazer']);else if(occ==='formal')pick('jacket',['blazer']);
  if(occ==='party'||occ==='formal')pick('other',['other','tie','jewelry']);
  if(S.gender!=='male'&&occ!=='sport')pick('bag',['bag']);
  if(wx==='hot'&&(occ==='casual'||occ==='sport'))pick('hat',['hat']);
  return o}
function needJ(wx){return wx==='cool'||wx==='cold'||wx==='rain'}
function say(occ,wx){var a={hot:'Hot out, so I kept it light.',mild:'Easy weather, nothing heavy needed.',cool:'A bit cool, so a jacket is in.',cold:'Cold day. I went for the warmer pieces.',rain:'Rain is coming, so I added a jacket.'};return a[wx]+' Matched for '+occ+'.'}
function missing(o,wx){var m=[];SLOTS.forEach(function(s){if(o[s[0]])return;if(['other','dress','bag','hat'].indexOf(s[0])>-1||(o.dress&&(s[0]==='top'||s[0]==='bottom')))return;if(s[0]==='jacket'&&!needJ(wx))return;m.push(s[1].toLowerCase())});return m}
function outfitHtml(o,wx,lockable){
  var h='<div class="card">';SLOTS.forEach(function(s){var i=o[s[0]];if(!i)return;
    h+='<div class="slot">'+th(i)+'<div><b>'+esc(i.name)+'</b><span class="mute">'+s[1]+', '+i.color+'</span></div>'+(lockable?'<button class="lock '+(T.locks[s[0]]?'on':'')+'" data-a="lock" data-v="'+s[0]+'">'+(T.locks[s[0]]?'Kept':'Keep')+'</button>':'')+'</div>'});
  h+='</div>';var m=missing(o,wx);if(m.length)h+='<p class="note">You have no '+m.join(', ')+' in your wardrobe yet. Add some for a full outfit.</p>';return h}
function viewToday(){
  if(!S.items.length)return '<div class="empty"><h2>Your wardrobe is empty</h2><p class="mute">Add a few pieces and I will start picking outfits.</p><button class="btn" data-a="add">Add a piece</button><button class="btn alt" data-a="sample">Try with sample clothes</button></div>';
  var h='<h2>Where are you headed?</h2>'+chips(OCC.map(function(o){return[o,o[0].toUpperCase()+o.slice(1)]}),T.occ,'occ')+'<h2>How is the weather?</h2>'+chips(WX,T.wx,'wx')+'<button class="chip" data-a="loc" style="margin-top:10px">Use my location</button>'+(T.locNote?'<p class="note" style="margin-top:8px">'+T.locNote+'</p>':'')+'<button class="btn" data-a="gen">'+(T.out?'Pick another':'Suggest an outfit')+'</button>';
  if(T.out){h+='<h2>Today’s outfit</h2>'+outfitHtml(T.out,T.wx,true)+'<p class="note">'+say(T.occ,T.wx)+why(T.out)+' Tap Keep on anything you love, then pick another.</p><button class="btn alt" data-a="wear">I’m wearing this</button><div class="row" style="margin-top:8px"><button class="chip" data-a="fav">Save outfit</button><button class="chip" data-a="share">Share</button></div>'+(T.just?'<p class="note">Logged. Send these pieces to the wash?</p><div class="row" style="margin-top:8px"><button class="chip" data-a="towash">Send to wash</button></div>':'')}
  var rw=S.log.filter(function(l){return l.t<=Date.now()}).slice(0,3);
  if(rw.length)h+='<h2>Recently worn</h2><div class="card">'+rw.map(function(l){return '<div class="slot"><div><b>'+new Date(l.t).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})+' · '+cap(l.occ)+'</b><span class="mute">'+esc(l.names)+'</span></div></div>'}).join('')+'</div>';
  return h}
var ONLY={dress:'f',skirt:'f',bag:'f',jewelry:'f',tie:'m'};
function ok(c){var o=ONLY[c];return!o||!S.gender||S.gender==='any'||(o==='f'?S.gender==='female':S.gender==='male')}
function catList(){return CATS.filter(function(c){return ok(c[0])})}
function askGender(){
  $('sheet').innerHTML='<div class="shade"><div class="sheet"><h2 style="margin-top:0;font-size:18px">Who are the outfits for?</h2><p class="mute">I’ll suggest clothes that suit you. You can change this anytime.</p><button class="btn" data-a="g" data-v="male">Male</button><button class="btn alt" data-a="g" data-v="female">Female</button><button class="btn alt" data-a="g" data-v="any">Prefer not to say</button>'+(S.gender?'<button class="btn alt" data-a="close">Cancel</button>':'')+'</div></div>'}
function gaps(){
  var it=S.items,g=[];if(!it.length)return g;
  function n(f){return it.filter(f).length}
  function cat(k){return n(function(i){return i.cat===k})}
  function has(k,st){return n(function(i){return i.cat===k&&i.styles.indexOf(st)>-1})}
  function add(t,why,d){g.push({t:t,why:why,d:d})}
  var tops=n(function(i){return i.cat==='tshirt'||i.cat==='shirt'}),sk=cat('socks');
  var f=S.gender==='female';
  function bot(){return cat('pants')+cat('skirt')+cat('shorts')}
  if(!bot())add(f?'Pants or a skirt':'Pants','You have no pants yet, so I can’t finish an outfit.',{name:'Dark jeans',cat:'pants',color:'navy',warm:1,styles:['casual','party']});
  if(!cat('shoes'))add('Everyday shoes','No shoes in your wardrobe yet.',{name:'White sneakers',cat:'shoes',color:'white',warm:1,styles:['casual','sport']});
  if(sk<4)add('More socks',sk?'You only have '+sk+' pair'+(sk===1?'':'s')+', so they repeat a lot.':'No socks yet.',{name:'Black socks',cat:'socks',color:'black',warm:1,styles:['casual','work','formal']});
  if(tops<4)add('A few more tops','With '+tops+' top'+(tops===1?'':'s')+', your outfits repeat quickly.',{name:'White tee',cat:'tshirt',color:'white',warm:0,styles:['casual','sport']});
  if(bot()===1)add('A second pair of pants','One pair means the same bottoms every time.',{name:'Beige chinos',cat:'pants',color:'beige',warm:1,styles:['casual','work']});
  if(cat('shoes')===1)add('A second pair of shoes','Gives you a change between casual and smart.',{name:'Brown loafers',cat:'shoes',color:'brown',warm:1,styles:['work','formal']});
  if(it.length>=5){
    if(!has('shirt','formal')&&!has('shirt','work'))add(f?'A smart blouse':'A smart shirt','Nothing yet for work or formal days.',{name:f?'White blouse':'White dress shirt',cat:'shirt',color:'white',warm:1,styles:['work','formal','party']});
    if(!has('pants','formal')&&!has('skirt','formal'))add(f?'Tailored trousers or skirt':'Dress trousers','No smart bottoms for formal days.',{name:f?'Tailored trousers':'Black trousers',cat:'pants',color:'black',warm:1,styles:['formal','work','party']});
    if(!has('shoes','formal'))add(f?'Smart shoes':'Dress shoes','Nothing suitable for formal days.',{name:f?'Black flats':'Black dress shoes',cat:'shoes',color:'black',warm:1,styles:['formal','work']});
    if(!has('shoes','sport'))add('Sport shoes','Nothing for workouts yet.',{name:'Running shoes',cat:'shoes',color:'grey',warm:1,styles:['sport']});
    if(!has('tshirt','party')&&!has('shirt','party'))add('A going-out top','No top set for parties yet.',{name:'Black shirt',cat:'shirt',color:'black',warm:1,styles:['party','formal']});
  }
  if(f&&!cat('dress'))add('A dress','One piece and you’re dressed. Good for casual, party or work days.',{name:'Midi dress',cat:'dress',color:'blue',warm:1,styles:['casual','party','work']});
  if(!n(function(i){return(i.cat==='tshirt'||i.cat==='shirt')&&i.warm===0}))add('A light top','Nothing light enough for hot days.',{name:'Light cotton tee',cat:'tshirt',color:'white',warm:0,styles:['casual','sport']});
  if(!cat('jacket'))add('A jacket','Cool, cold and rainy days need one.',{name:'Light jacket',cat:'jacket',color:'navy',warm:1,styles:['casual','work']});
  else if(!n(function(i){return i.cat==='jacket'&&i.warm===2}))add('A warm coat','Nothing warm enough for cold days.',{name:'Wool coat',cat:'jacket',color:'black',warm:2,styles:['formal','work','casual']});
  if(!n(function(i){return(i.cat==='pants'||i.cat==='skirt'||i.cat==='shorts')&&i.warm===0}))add('Light bottoms','Nothing light for hot days.',{name:f?'Denim shorts':'Chino shorts',cat:'shorts',color:f?'blue':'beige',warm:0,styles:['casual','sport']});
  if(f&&!cat('skirt'))add('A skirt','Adds more ways to dress up or down.',{name:'Midi skirt',cat:'skirt',color:'black',warm:1,styles:['casual','work','party']});
  if(!cat('sweater'))add('A sweater or hoodie','Your warm layer for cool evenings.',{name:'Grey hoodie',cat:'sweater',color:'grey',warm:2,styles:['casual','sport']});
  if(!cat('blazer'))add('A blazer','Instantly smartens work, party and formal outfits.',{name:f?'Cream blazer':'Navy blazer',cat:'blazer',color:f?'beige':'navy',warm:1,styles:['work','formal','party']});
  if(f&&!cat('bag'))add('A handbag','Finishes everyday and going-out outfits.',{name:'Leather handbag',cat:'bag',color:'brown',warm:1,styles:['casual','work','party']});
  if(S.gender!=='female'&&!cat('tie'))add('A tie or belt','Completes formal and work outfits.',{name:'Silk tie',cat:'tie',color:'navy',warm:1,styles:['formal','work']});
  var neu=n(function(i){return NEU.indexOf(i.color)>-1});
  if(it.length>=4&&neu/it.length<.5)add('Neutral basics','Most of your pieces are bold colours, which makes matching harder.',{name:'Grey tee',cat:'tshirt',color:'grey',warm:1,styles:['casual','work']});
  if(!cat('other')&&!(f&&cat('jewelry')))add(f?'Jewellery or a bag':'A watch or belt','Finishes off party and formal outfits.',{name:f?'Gold necklace':'Leather belt',cat:f?'jewelry':'other',color:'brown',warm:1,styles:['formal','work','party']});
  var seen={};return g.filter(function(x){return!seen[x.d.name]&&(seen[x.d.name]=1)}).slice(0,6)}
function viewWardrobe(){
  var list=S.items.filter(function(i){return T.filt==='all'||i.cat===T.filt});
  var h='<h2>Your wardrobe <span class="mute">('+S.items.length+')</span></h2>'+chips([['all','All']].concat(catList()),T.filt,'filt')+'<input type="text" id="q" placeholder="Search by name or colour" value="'+esc(T.q||'')+'" style="margin-top:12px"><button class="btn" data-a="add">Add a piece</button>';
  if(S.items.length){var sg=gaps();h+='<h2>Worth adding</h2><div class="card">'+(sg.length?sg.map(function(x,i){return '<div class="slot"><div><b>'+x.t+'</b><span class="mute">'+x.why+'</span></div><button class="lock" data-a="sug" data-v="'+i+'">Add</button></div>'}).join(''):'<p class="mute" style="padding:10px 0">Looking good. Nothing important is missing right now.</p>')+'</div>'}
  if(!list.length)h+='<p class="note">Nothing here yet.</p>';
  h+='<div class="grid" id="grid">'+gridHtml()+'</div>';return h}
function cap(x){return x[0].toUpperCase()+x.slice(1)}
function sb(i){var y=S.sty;if(!y)return 0;var b=0,n=NEU.indexOf(i.color)>-1,v=y.vibe;if(y.col==='neutral'&&n)b++;if(y.col==='bold'&&!n)b++;if(v==='relaxed'&&['tshirt','sweater','shorts'].indexOf(i.cat)>-1)b++;if(v==='smart'&&['shirt','blazer','tie','jewelry'].indexOf(i.cat)>-1)b++;if(v==='sporty'&&i.styles.indexOf('sport')>-1)b++;return b}

function locate(){
  if(!navigator.geolocation){toast('Location is not available on this device.');return}
  toast('Checking your location…');
  navigator.geolocation.getCurrentPosition(function(p){
    var lat=p.coords.latitude,n=new Date(),m=n.getMonth()+n.getDate()/30;
    var amp=.25*Math.abs(lat),ph=Math.cos(2*Math.PI*(m-6.5)/12)*(lat<0?-1:1);
    var c=Math.round(28-.4*Math.abs(lat)+amp*ph);
    var wx=c>=27?'hot':c>=19?'mild':c>=10?'cool':'cold';
    T.wx=wx;T.out=null;T.locks={};WEEK.forEach(function(w){w.wx=wx;w.out=null});
    T.locNote='Typical for your area at this time of year: about '+c+'°C. I set the weather to '+wx.toUpperCase().charAt(0)+wx.slice(1)+'. Tap Rainy if it’s wet today.';
    render();
  },function(){toast('Location was blocked. Pick the weather yourself, or allow location in your browser settings.')},{timeout:10000});
}

document.addEventListener('click',function(e){

  if(a==='wx'){T.wx=v;T.out=null;T.locks={};render();return}
  if(a==='gen'){T.just=false;T.out=gen(T.occ,T.wx,T.locks);render();return}

  if(a==='clean'){byId(v).dirty=false;save();render();return}
  if(a==='cleanall'){S.items.forEach(function(i){i.dirty=false});save();render();return}
  if(a==='filt'){T.filt=v;render();return}
  if(a==='add'){draft=newDraft();sheet();return}
  if(a==='quiz'){askStyle();return}
  if(a==='qc'){Q.col=v;styleSheet();return}
  if(a==='qv'){Q.vibe=v;styleSheet();return}
  if(a==='qs'){S.sty={col:Q.col,vibe:Q.vibe};save();$('sheet').innerHTML='';T.out=null;render();toast('Style saved.');return}
  if(a==='pd'){P.days=+v;render();return}

  if(a==='cm'){var c=T.cal;c.m+=+v;if(c.m<0){c.m=11;c.y--}if(c.m>11){c.m=0;c.y++}c.sel=null;render();return}
  if(a==='cd'){T.cal.sel=+v;render();return}
  if(a==='cput'){var c2=T.cal;addLog(new Date(c2.y,c2.m,c2.sel,12).getTime(),T.out,T.occ);toast('Added to your calendar.');render();return}
  if(a==='wcal'){WEEK.forEach(function(w,n){if(w.out){var d=new Date();d.setDate(d.getDate()+n);d.setHours(12,0,0,0);addLog(d.getTime(),w.out,w.occ)}});toast('Week added to your calendar.');return}

  for(var i=1;i<18;i++){var t=i/18,u=1-t,x=2*u*t*90+t*t*180,y=2*u*t*-50+t*t*10,ang=Math.atan2(-100*u+120*t,180)*57.3,L=46*(1-.55*t);
    [-1,1].forEach(function(sd){s+='<path transform="translate('+x.toFixed(1)+' '+y.toFixed(1)+') rotate('+(ang+sd*58).toFixed(1)+')" d="M0 0Q'+L/2+' -6 '+L+' 0Q'+L/2+' 6 0 0Z"/>'})}
  return s+'</g>'}
